# Local dev Airflow (off by default): docker compose --profile airflow up -d --build
# One lean container (entrypoint.sh `dev`): api-server + scheduler + dag-processor, SQLite metadata
# DB, LocalExecutor. No Postgres / Redis / Celery / triggerer. Paths are relative to this file.
services:
  airflow:
    profiles: [airflow]
    build:
      context: ../..
      dockerfile: infra/airflow/Dockerfile
    image: casarecon-airflow:dev
    command: dev
    ports: ["${AIRFLOW_PORT:-8080}:8080"]   # UI; AIRFLOW_PORT=8090 if 8080 is taken
    mem_limit: ${AIRFLOW_MEM_LIMIT:-1536m}   # full 135k-row analyze needs ~1.5g (docs/AIRFLOW.md)
    environment:
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "1"               # one task at a time: DuckDB has one writer
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__API_AUTH__JWT_SECRET: local-dev-only-jwt-secret      # shared by api-server + scheduler
      AIRFLOW__API__SECRET_KEY: local-dev-only-secret-key
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      RECON_HOME: /opt/recon                        # the DAGs cd here and call .venv/bin/recon
      CASARECON_FIGURE_FORMAT: html                 # no Chrome in the image: plotly figures as HTML
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - ../../data:/opt/recon/data
      - ../../reports:/opt/recon/reports
      - ../../config:/opt/recon/config
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
